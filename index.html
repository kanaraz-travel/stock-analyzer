<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#f3f4f6" />
  <title>주식 초보 AI분석기</title>
  <link rel="manifest" href="/public/manifest.webmanifest" />
  <link rel="stylesheet" href="/assets/styles.css?v=1.4.0" />
</head>
<body>
  <main id="screen-login" class="login-screen">
    <div class="login-wrap">
      <div class="login-header">
        <div class="login-logo">📊</div>
        <h1 class="login-title">주식 초보 AI분석기</h1>
        <p class="login-subtitle">이름을 선택해 주세요</p>
      </div>
      <div class="login-card">
        <div id="login-buttons" class="login-buttons"></div>
        <!-- 비밀번호 입력 영역 추가 -->
        <div id="login-password-wrap" hidden style="margin-top:16px;">
          <label class="label">비밀번호
            <input type="password" id="login-password" autocomplete="current-password" placeholder="비밀번호 입력" />
          </label>
          <button type="button" id="login-submit" class="btn btn--primary btn--block">로그인</button>
        </div>
        <p id="login-error" class="error-text" hidden></p>
        <p id="login-loading" class="login-loading" hidden>로그인 중…</p>
      </div>
      <p class="login-footer-note">이 앱은 분석·기록 도구이며, 증권사 주문을 자동으로 실행하지 않습니다.</p>
    </div>
  </main>

  <div id="app-shell" hidden>
    <header class="app-header">
      <div class="header-row">
        <div class="app-brand">주식 초보 AI분석기</div>
        <div class="header-user">
          <span id="current-user-name" class="current-user-name"></span>
          <button id="settings-btn" class="logout-btn" type="button" title="계정 설정" style="margin-right:8px;">⚙️</button>
          <button id="logout-btn" class="logout-btn" type="button">로그아웃</button>
        </div>
      </div>
      <div class="header-meta">
        <div class="header-badges">
          <span id="market-status-badge" class="badge">시장 상태 확인 중</span>
          <span id="data-status-badge" class="badge badge--muted">데이터 상태 확인 중</span>
          <span id="auto-batch-badge" class="badge badge--muted" hidden>자동 대기</span>
        </div>
        <div class="header-actions">
          <button id="batch-build-btn" class="batch-btn" type="button" hidden>이력 쌓기</button>
          <button id="refresh-btn" class="refresh-btn" type="button" disabled>새로고침 (5)</button>
        </div>
      </div>
    </header>

    <main id="screen-analysis" class="screen">
      <section class="card search-card">
        <label for="ticker-input" class="label">종목 검색</label>
        <div class="search-row">
          <input id="ticker-input" type="text" placeholder="예: 삼성전자" />
          <button id="search-btn" class="btn btn--primary" type="button">조회</button>
        </div>
        <p id="search-error" class="error-text" hidden></p>
      </section>

      <section id="quote-card" class="card" hidden>
        <div class="quote-head">
          <div>
            <h2 id="stock-name" class="stock-name">-</h2>
          </div>
          <div class="quote-price-wrap">
            <div id="current-price" class="current-price">-</div>
            <div id="change-rate" class="change-rate">-</div>
          </div>
        </div>
        <div class="quote-meta">
          <span id="quote-as-of">시세 시각: -</span>
        </div>
        <button id="analyze-btn" class="btn btn--primary btn--block" type="button">AI 분석하기</button>
      </section>

      <section id="analysis-result" class="card" hidden>
        <div class="analysis-head">
          <div id="recommendation-badge" class="recommendation-badge">-</div>
          <div id="analysis-timestamp" class="analysis-timestamp">분석 시각: -</div>
        </div>

        <div class="analysis-block">
          <h4 class="analysis-block-title">종합 분석</h4>
          <p id="overall-summary" class="overall-summary-text">-</p>
        </div>
      </section>
    </main>

    <main id="screen-holdings" class="screen screen--active">
      <section class="card">
        <h2 class="section-title">보유 요약</h2>
        <div id="holdings-summary" class="summary-grid">
          <div class="summary-item"><span class="summary-label">총 투자 금액</span><span id="total-cost" class="summary-value">-</span></div>
          <div class="summary-item"><span class="summary-label">현재 평가 금액</span><span id="total-value" class="summary-value">-</span></div>
          <div class="summary-item"><span class="summary-label">평가 손익 (미실현)</span><span id="total-pnl" class="summary-value">-</span></div>
          <div class="summary-item"><span class="summary-label">실현 손익</span><span id="realized-pnl" class="summary-value">-</span></div>
        </div>
        <p class="note-text">수수료·세금이 반영되지 않은 단순 계산 결과입니다.</p>
      </section>

      <section class="card">
        <h2 class="section-title" id="tx-form-title">거래 등록</h2>
        <form id="transaction-form" class="tx-form" novalidate>
          <input type="hidden" id="tx-id" />
          <div class="form-row form-row--3">
            <label class="label">종목명 <input id="tx-stock-name" type="text" placeholder="종목명" required /></label>
            <label class="label">거래 종류
              <select id="tx-type" required>
                <option value="BUY">매수</option>
                <option value="SELL">매도</option>
              </select>
            </label>
            <label class="label">거래일 <input id="tx-date" type="date" required /></label>
          </div>
          <div class="form-row form-row--3">
            <label class="label">단가 <input id="tx-price" type="number" step="0.0001" min="0.0001" required /></label>
            <label class="label">수량 <input id="tx-qty" type="number" step="0.000001" min="0.000001" required /></label>
            <div class="label label--button">
              <span class="label-text"> </span>
              <button class="btn btn--primary btn--block" type="submit" id="tx-submit-btn">거래 저장</button>
            </div>
          </div>
          <button class="btn btn--block" type="button" id="tx-cancel-btn" hidden>취소</button>
          <p id="tx-error" class="error-text" hidden></p>
        </form>
      </section>

      <section class="card">
        <h2 class="section-title">보유 종목</h2>
        <div id="holdings-list" class="holdings-list">
          <p class="empty-text">아직 등록된 거래가 없습니다.</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn nav-btn--active" data-screen="analysis" type="button">
        <span class="nav-icon">📊</span><span>주식 분석</span>
      </button>
      <button class="nav-btn" data-screen="holdings" type="button">
        <span class="nav-icon">💼</span><span>내 보유 주식</span>
      </button>
    </nav>
  </div>

  <!-- ⚙️ 계정 설정 모달 -->
  <div id="settings-modal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;">
    <div style="background:#fff;border-radius:16px;padding:24px;max-width:400px;width:100%;box-shadow:0 4px 12px rgba(0,0,0,.15);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="font-size:17px;font-weight:700;margin:0;">계정 설정</h3>
        <button type="button" data-close style="background:none;border:none;font-size:20px;cursor:pointer;padding:0;color:#64748b;">✕</button>
      </div>
      <form id="password-form">
        <label class="label">현재 비밀번호
          <input type="password" id="current-password" autocomplete="current-password" required>
        </label>
        <label class="label">새 비밀번호 (6자 이상)
          <input type="password" id="new-password" autocomplete="new-password" required minlength="6">
        </label>
        <label class="label">새 비밀번호 확인
          <input type="password" id="new-password-confirm" autocomplete="new-password" required minlength="6">
        </label>
        <p id="password-error" class="error-text" hidden style="margin-top:8px;"></p>
        <p id="password-ok" style="color:#10b981;font-size:13px;margin-top:8px;font-weight:600;" hidden></p>
        <div style="display:flex;gap:8px;margin-top:20px;">
          <button type="button" data-close class="btn btn--block" style="background:#f3f4f6;color:#374151;">취소</button>
          <button type="submit" id="password-submit" class="btn btn--primary btn--block">변경</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/app.js?v=1.4.0" type="module"></script>
</body>
</html>
